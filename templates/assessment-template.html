<!doctype html>
<html lang="zh-CN" data-daily-srl-client="2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>每日学习评估</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f2;
      --surface: #ffffff;
      --text: #202421;
      --muted: #667069;
      --line: #dfe4de;
      --accent: #245b45;
      --accent-soft: #e9f2ed;
      --danger: #9c3e3e;
      --danger-soft: #fff3f1;
      --ok: #1e6b4e;
      --shadow: 0 14px 40px rgba(34, 50, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button { cursor: pointer; }

    .page {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.3rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .intro {
      max-width: 680px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 30px 0 16px;
    }

    .date {
      color: var(--muted);
      font-weight: 650;
    }

    .button {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 11px 17px;
      background: var(--accent);
      color: white;
      font-weight: 720;
    }

    .button:hover { filter: brightness(0.96); }
    .button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(36, 91, 69, 0.25);
      outline-offset: 2px;
    }

    .button.secondary {
      border-color: var(--line);
      background: var(--surface);
      color: var(--text);
    }

    .button.danger {
      border-color: #f0d5d0;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .task-list {
      display: grid;
      gap: 16px;
    }

    .task-card {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .task-number {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .remove-task {
      border: 0;
      background: transparent;
      color: var(--danger);
      font-weight: 700;
      padding: 7px 9px;
      border-radius: 9px;
    }

    .remove-task:hover { background: var(--danger-soft); }

    .field { margin-top: 20px; }

    .task-card > .field:first-of-type { margin-top: 0; }

    label, legend {
      display: block;
      margin: 0 0 10px;
      font-weight: 720;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fcfdfb;
      color: var(--text);
      min-height: 50px;
      padding: 14px 16px;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      gap: 18px;
      margin-top: 20px;
    }

    .two-column > .field { margin-top: 0; }

    fieldset {
      min-width: 0;
      margin: 22px 0 0;
      padding: 0;
      border: 0;
    }

    .confidence-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .confidence-option {
      position: relative;
    }

    .confidence-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .confidence-option span {
      display: block;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 9px;
      text-align: center;
      color: var(--muted);
      font-weight: 680;
    }

    .confidence-option input:checked + span {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .confidence-option input:focus-visible + span {
      outline: 3px solid rgba(36, 91, 69, 0.25);
      outline-offset: 2px;
    }

    .empty-state {
      border: 1px dashed #cbd3cc;
      border-radius: 18px;
      padding: 28px;
      background: rgba(255, 255, 255, 0.55);
      color: var(--muted);
      text-align: center;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    [hidden] { display: none !important; }

    .status {
      min-height: 48px;
      margin-top: 16px;
      border-radius: 13px;
      padding: 12px 14px;
      background: #ebeeea;
      color: var(--muted);
    }

    .status.ok { background: var(--accent-soft); color: var(--ok); }
    .status.error { background: var(--danger-soft); color: var(--danger); }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 22px, 900px); padding-top: 28px; }
      .meta { align-items: flex-start; flex-direction: column; }
      .two-column, .confidence-options { grid-template-columns: 1fr; }
      .task-card { padding: 20px; border-radius: 18px; }
      .actions .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">每日学习 · 行动前评估</p>
    <h1>先看看今天准备怎么学</h1>
    <p class="intro">确认一下任务、时间和自己的把握。这里保持简单；需要进一步讨论的地方，之后再聊。</p>

    <div class="meta">
      <div class="date" id="assessmentDate"></div>
      <button class="button secondary" id="addTask" type="button">＋ 添加任务</button>
    </div>

    <section id="taskList" class="task-list" aria-label="今日学习任务"></section>

    <div class="actions">
      <button class="button" id="saveAssessment" type="button">保存今日评估</button>
      <button class="button secondary" id="reloadAssessment" type="button">重新读取已保存内容</button>
    </div>

    <div class="actions" aria-label="保存恢复">
      <button class="button secondary" id="cancel-wait" type="button" hidden>取消等待</button>
      <button class="button secondary" id="recover-save" type="button" hidden>检查保存状态</button>
      <button class="button secondary" id="restore-draft" type="button" hidden>恢复草稿</button>
      <button class="button secondary" id="export-draft" type="button" hidden>导出未保存草稿</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">正在读取已保存内容…</div>
  </main>

  <script id="initial-assessment-state" type="application/json">__ASSESSMENT_STATE_JSON__</script>
  <script id="save-context" type="application/json">__SAVE_CONTEXT_JSON__</script>
  <script src="save-client.js"></script>
  <script>
    (() => {
      "use strict";

      const CONFIDENCE_OPTIONS = [
        { value: "confident", label: "有把握" },
        { value: "uncertain", label: "有点悬" },
        { value: "not_confident", label: "没把握" }
      ];
      const API_PATH = "/api/assessment-state";
      const rawInitialState = document.getElementById("initial-assessment-state").textContent.trim();
      const isTemplatePreview = location.protocol === "file:" || !rawInitialState.startsWith("{");
      const initialState = rawInitialState.startsWith("{") ? JSON.parse(rawInitialState) : createTemplatePreviewState();
      const taskList = document.getElementById("taskList");
      const status = document.getElementById("status");
      const dateLabel = document.getElementById("assessmentDate");
      let state = normalizeState(initialState);
      const rawContext = document.getElementById("save-context").textContent.trim();
      const saveContext = rawContext.startsWith("{") ? JSON.parse(rawContext) : {};
      const client = DailySRLSaveClient.create({
        api: API_PATH, preview: isTemplatePreview, context: saveContext,
        read: () => state,
        apply: (value, redraw) => {
          if (redraw) { state = normalizeState(value); render(); }
          else state.saved_at = value.saved_at;
        },
        status: (message, error) => setStatus(message, error ? "error" : "")
      });

      function createTemplatePreviewState() {
        const assessmentDate = new Date().toISOString().slice(0, 10);
        const datePart = assessmentDate.replaceAll("-", "");
        return {
          schema_version: 1,
          assessment_date: assessmentDate,
          generated_at: new Date().toISOString(),
          saved_at: null,
          next_task_number: 2,
          tasks: [
            {
              task_id: `task-${datePart}-001`,
              task: "示例学习任务",
              planned_start: "19:00",
              estimated_duration_minutes: 45,
              confidence: "uncertain"
            }
          ]
        };
      }

      function normalizeState(candidate) {
        const fallbackDate = new Date().toISOString().slice(0, 10);
        const tasks = Array.isArray(candidate?.tasks) ? candidate.tasks.map((task) => ({
          task_id: String(task.task_id || ""),
          task: String(task.task || ""),
          planned_start: String(task.planned_start || ""),
          estimated_duration_minutes: Number.isInteger(task.estimated_duration_minutes)
            ? task.estimated_duration_minutes
            : null,
          confidence: String(task.confidence || "")
        })) : [];
        return {
          schema_version: 1,
          assessment_date: String(candidate?.assessment_date || fallbackDate),
          generated_at: candidate?.generated_at || new Date().toISOString(),
          saved_at: candidate?.saved_at || null,
          next_task_number: Number.isInteger(candidate?.next_task_number)
            ? candidate.next_task_number
            : tasks.length + 1,
          tasks
        };
      }

      function setStatus(message, kind = "") {
        status.textContent = message;
        status.className = `status ${kind}`.trim();
      }

      function displayDate(value) {
        const parsed = new Date(`${value}T00:00:00`);
        if (Number.isNaN(parsed.getTime())) return value;
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric", month: "long", day: "numeric", weekday: "short"
        }).format(parsed);
      }

      function createInput(id, value, attributes = {}) {
        const input = document.createElement("input");
        input.id = id;
        input.value = value ?? "";
        Object.entries(attributes).forEach(([name, attributeValue]) => {
          if (attributeValue === true) input.setAttribute(name, "");
          else input.setAttribute(name, String(attributeValue));
        });
        return input;
      }

      function render() {
        dateLabel.textContent = displayDate(state.assessment_date);
        taskList.replaceChildren();

        if (state.tasks.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "今天还没有任务。需要时可以添加一项。";
          taskList.appendChild(empty);
          return;
        }

        state.tasks.forEach((task, index) => {
          const card = document.createElement("article");
          card.className = "task-card";
          card.dataset.taskId = task.task_id;

          const head = document.createElement("div");
          head.className = "card-head";
          const number = document.createElement("p");
          number.className = "task-number";
          number.textContent = `任务 ${index + 1}`;
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove-task";
          remove.textContent = "删除";
          remove.setAttribute("aria-label", `删除任务 ${index + 1}`);
          remove.addEventListener("click", () => {
            state.tasks = state.tasks.filter((item) => item.task_id !== task.task_id);
            client.edit();
            render();
            setStatus("已从当前页面删除任务；保存后会同步更新。", "");
          });
          head.append(number, remove);

          const taskField = document.createElement("div");
          taskField.className = "field";
          const taskLabel = document.createElement("label");
          taskLabel.htmlFor = `task-${task.task_id}`;
          taskLabel.textContent = "任务";
          const taskInput = createInput(`task-${task.task_id}`, task.task, {
            type: "text", required: true, placeholder: "例如：完成数学练习册第31至35页"
          });
          taskInput.addEventListener("input", (event) => { task.task = event.target.value; client.edit(); });
          taskField.append(taskLabel, taskInput);

          const twoColumn = document.createElement("div");
          twoColumn.className = "two-column";

          const startField = document.createElement("div");
          startField.className = "field";
          const startLabel = document.createElement("label");
          startLabel.htmlFor = `start-${task.task_id}`;
          startLabel.textContent = "准备什么时候做";
          const startInput = createInput(`start-${task.task_id}`, task.planned_start, {
            type: "text", required: true, placeholder: "例如：19:00 或晚饭后"
          });
          startInput.addEventListener("input", (event) => { task.planned_start = event.target.value; client.edit(); });
          startField.append(startLabel, startInput);

          const durationField = document.createElement("div");
          durationField.className = "field";
          const durationLabel = document.createElement("label");
          durationLabel.htmlFor = `duration-${task.task_id}`;
          durationLabel.textContent = "预计需要多久（分钟）";
          const durationInput = createInput(
            `duration-${task.task_id}`,
            task.estimated_duration_minutes ?? "",
            { type: "number", min: 1, step: 1, required: true, placeholder: "例如：45" }
          );
          durationInput.addEventListener("input", (event) => {
            task.estimated_duration_minutes = event.target.value === ""
              ? null
              : Number(event.target.value);
            client.edit();
          });
          durationField.append(durationLabel, durationInput);
          twoColumn.append(startField, durationField);

          const confidenceField = document.createElement("fieldset");
          const legend = document.createElement("legend");
          legend.textContent = "有没有把握按计划完成";
          const options = document.createElement("div");
          options.className = "confidence-options";
          CONFIDENCE_OPTIONS.forEach((option) => {
            const optionLabel = document.createElement("label");
            optionLabel.className = "confidence-option";
            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = `confidence-${task.task_id}`;
            radio.value = option.value;
            radio.checked = task.confidence === option.value;
            radio.required = true;
            radio.addEventListener("change", () => { task.confidence = option.value; client.edit(); });
            const labelText = document.createElement("span");
            labelText.textContent = option.label;
            optionLabel.append(radio, labelText);
            options.appendChild(optionLabel);
          });
          confidenceField.append(legend, options);

          card.append(head, taskField, twoColumn, confidenceField);
          taskList.appendChild(card);
        });
      }

      function nextTaskId() {
        const datePart = state.assessment_date.replaceAll("-", "");
        const number = state.next_task_number;
        state.next_task_number += 1;
        return `task-${datePart}-${String(number).padStart(3, "0")}`;
      }

      function validate() {
        for (let index = 0; index < state.tasks.length; index += 1) {
          const task = state.tasks[index];
          if (!task.task.trim()) return `请填写任务 ${index + 1} 的任务内容。`;
          if (!task.planned_start.trim()) return `请填写任务 ${index + 1} 准备什么时候做。`;
          if (!Number.isInteger(task.estimated_duration_minutes) || task.estimated_duration_minutes < 1) {
            return `请填写任务 ${index + 1} 的预计分钟数。`;
          }
          if (!CONFIDENCE_OPTIONS.some((option) => option.value === task.confidence)) {
            return `请选择任务 ${index + 1} 的完成把握。`;
          }
        }
        return null;
      }

      async function loadFromDisk(announce = true) {
        if (isTemplatePreview) {
          setStatus("这里可以体验添加、删除和编辑，但修改不会保存。请从对话中打开今天的学习页面。");
          return;
        }
        await client.load(announce);
      }

      let saving = false;
      async function save() {
        if (isTemplatePreview) {
          setStatus("这里是预览，修改不会保存。请从对话中打开今天的学习页面再保存。");
          return;
        }
        if (saving) return;
        const validationMessage = validate();
        if (validationMessage) { setStatus(validationMessage, "error"); return; }
        saving = true;
        const button = document.getElementById("saveAssessment");
        button.disabled = true;
        try {
          const result = await client.save(state);
          if (result.ok) client.notify(result.current
            ? "今日评估已保存。重新打开页面会恢复当前内容。"
            : "之前的内容已保存；最新填写内容尚未保存，请再次点击保存。");
        } finally { saving = false; button.disabled = false; }
      }

      document.getElementById("addTask").addEventListener("click", () => {
        const task = {
          task_id: nextTaskId(),
          task: "",
          planned_start: "",
          estimated_duration_minutes: null,
          confidence: ""
        };
        state.tasks.push(task);
        client.edit();
        render();
        document.getElementById(`task-${task.task_id}`).focus();
        setStatus("已添加任务；填写后保存即可。", "");
      });

      document.getElementById("saveAssessment").addEventListener("click", save);
      document.getElementById("reloadAssessment").addEventListener("click", () => loadFromDisk(true));

      render();
      loadFromDisk(false);
    })();
  </script>
</body>
</html>
